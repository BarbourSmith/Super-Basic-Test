<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dinosaur Motel sign panel outline
  Traced from reference photo, corrected for the ~8% perspective
  foreshortening across the panel.

  Coordinate system: 1 unit = 1 mm at the size below (1000 mm wide).
  Scale uniformly to whatever size you need.

  Orientation is "as hung" - the tilt is part of the look.
  To level the bottom edge, rotate the whole path -1.2 degrees.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000mm" height="529mm"
     viewBox="0 0 1000 529">
  <path id="sign-panel"
        d="M 0 0 L 1000 226 L 930 529 L 20 510 Z"
        fill="none" stroke="#000000" stroke-width="2"/>
</svg>
